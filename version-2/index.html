<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuzzy Tsukamoto - Kelayakan Kredit</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>Penilaian Kelayakan Kredit</h1>
          <p class="subtitle">Metode Fuzzy Tsukamoto</p>
        </div>
        <label class="mode-toggle">
          <input type="checkbox" id="modeToggle" />
          <span>MODE ADMIN</span>
        </label>
      </header>

      <nav class="tabs">
        <button class="tab-button active" data-tab="customer">Customer</button>
        <button class="tab-button" data-tab="admin" id="adminTabButton">
          Admin
        </button>
      </nav>

      <section class="tab-content active" id="tab-customer">
        <form id="creditForm" class="card">
          <h2>Input Customer</h2>
          <div class="grid">
            <label>
              Income (juta/bulan)
              <input
                type="number"
                id="incomeInput"
                min="0"
                step="0.1"
                required
              />
            </label>
            <label>
              Loan (juta)
              <input type="number" id="loanInput" min="0" step="0.1" required />
            </label>
            <label>
              Tenor (bulan)
              <input type="number" id="tenorInput" min="1" step="1" required />
            </label>
            <label>
              Collateral (juta)
              <input
                type="number"
                id="collateralInput"
                min="0"
                step="0.1"
                required
              />
            </label>
          </div>
          <button type="submit" class="primary">Hitung</button>
        </form>

        <div class="card" id="resultCard">
          <h2>Hasil</h2>
          <div class="result-grid">
            <div>
              <span class="label">Ratio (%)</span>
              <strong id="ratioValue">-</strong>
            </div>
            <div>
              <span class="label">Coverage (%)</span>
              <strong id="coverageValue">-</strong>
            </div>
            <div>
              <span class="label">Skor (Z)</span>
              <strong id="scoreValue">-</strong>
            </div>
            <div>
              <span class="label">Keputusan</span>
              <strong id="decisionValue">-</strong>
            </div>
          </div>
          <div class="note" id="ruleCount">Rule aktif: 0</div>
        </div>
      </section>

      <section class="tab-content" id="tab-admin">
        <div class="card">
          <div class="admin-header">
            <h2>Manajemen Rule</h2>
            <div class="actions">
              <button id="addRuleBtn" class="secondary" type="button">
                Tambah Rule
              </button>
              <button id="resetRulesBtn" class="ghost" type="button">
                Reset Default
              </button>
            </div>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Income</th>
                  <th>Ratio</th>
                  <th>Coverage</th>
                  <th>Consequent</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="rulesTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
